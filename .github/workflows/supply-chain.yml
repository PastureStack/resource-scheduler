name: PastureStack / Build, test, and supply-chain evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-scheduler-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, SBOM, and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_VERSION: v0.8.22
      DAPPER_IMAGE: local/resource-scheduler-dapper:${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          sha256sum \
            .dockerignore \
            ubuntu-apt.lock \
            go.mod \
            go.sum \
            vendor/modules.txt \
            Dockerfile.dapper \
            Makefile \
            package/Dockerfile \
            toolchain/buildx-security.patch \
            scripts/build \
            scripts/entry \
            scripts/package \
            scripts/assess-runtime-vulnerabilities \
            scripts/assess-builder-vulnerabilities \
            scripts/test-builder-vex \
            scripts/test-runtime-image \
            toolchain/linux-libc-dev-review.json \
            scripts/check-build-downloads \
            scripts/check-migration-policy \
            .github/workflows/release.yml \
            .github/workflows/supply-chain.yml \
            > evidence/source-inputs.sha256
          go list -mod=vendor ./... > evidence/module-packages.txt
          bash scripts/check-build-downloads | tee evidence/build-policy.txt
          bash scripts/check-migration-policy | tee evidence/migration-policy.txt
          python3 scripts/test-builder-vex 2>&1 | tee evidence/builder-vex-gate-tests.txt

      - name: Build, test, package, and prove reproducibility
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ env.CANDIDATE_VERSION }}
        run: |
          set -euo pipefail
          make ci DAPPER_IMAGE="$DAPPER_IMAGE"
          expected_owner="$(id -u):$(id -g)"
          test "$(stat -c '%u:%g' bin/resource-scheduler)" = "$expected_owner"
          test "$(stat -c '%u:%g' dist/images)" = "$expected_owner"
          runtime_image="$(cat dist/images)"
          first_image_id="$(docker image inspect --format '{{.Id}}' "$runtime_image")"
          printf '%s\n' "$runtime_image" > evidence/runtime-image.txt
          printf '%s\n' "$first_image_id" > evidence/runtime-image-first-id.txt
          sha256sum bin/resource-scheduler > evidence/resource-scheduler-first.sha256
          first_binary_sha="$(cut -d ' ' -f1 evidence/resource-scheduler-first.sha256)"
          test "$(docker run --rm --entrypoint sha256sum "$runtime_image" /usr/bin/resource-scheduler | awk '{print $1}')" = \
            "$first_binary_sha"
          docker image inspect --format '{{json .Config}}' "$runtime_image" \
            > evidence/runtime-image-first-config.json
          docker run --rm --entrypoint cat "$runtime_image" \
            /usr/share/pasturestack/manifests/runtime-ubuntu-packages.tsv \
            > evidence/runtime-dpkg-first.tsv

          docker image rm "$runtime_image" "$DAPPER_IMAGE" >/dev/null
          rm -rf bin dist
          docker builder prune --all --force >/dev/null

          make ci DAPPER_IMAGE="$DAPPER_IMAGE"
          test "$(cat dist/images)" = "$runtime_image"
          second_image_id="$(docker image inspect --format '{{.Id}}' "$runtime_image")"
          printf '%s\n' "$second_image_id" > evidence/runtime-image-second-id.txt
          sha256sum bin/resource-scheduler > evidence/resource-scheduler-second.sha256
          diff -u evidence/resource-scheduler-first.sha256 evidence/resource-scheduler-second.sha256
          second_binary_sha="$(cut -d ' ' -f1 evidence/resource-scheduler-second.sha256)"
          test "$(docker run --rm --entrypoint sha256sum "$runtime_image" /usr/bin/resource-scheduler | awk '{print $1}')" = \
            "$second_binary_sha"
          docker image inspect --format '{{json .Config}}' "$runtime_image" \
            > evidence/runtime-image-second-config.json
          docker run --rm --entrypoint cat "$runtime_image" \
            /usr/share/pasturestack/manifests/runtime-ubuntu-packages.tsv \
            > evidence/runtime-dpkg-second.tsv
          diff -u evidence/runtime-image-first-config.json evidence/runtime-image-second-config.json
          diff -u evidence/runtime-dpkg-first.tsv evidence/runtime-dpkg-second.tsv
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'RUNTIME_IMAGE=%s\n' "$runtime_image" >> "$GITHUB_ENV"

      - name: Verify packaged scheduler health contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-runtime-image "$RUNTIME_IMAGE" | tee evidence/runtime-health-smoke.txt

      - name: Verify resolved package and toolchain manifests
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(sed -n "s/^UBUNTU_APT_SNAPSHOT='\([^']*\)'$/\1/p" ubuntu-apt.lock)"
          test "$snapshot" = 20261020T000000Z

          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/dapper-ubuntu-packages.tsv \
            > evidence/dapper-dpkg.tsv
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/dapper-toolchain.tsv \
            > evidence/dapper-gcc.tsv
          docker image inspect --format '{{.Id}}' "$DAPPER_IMAGE" > evidence/dapper-image-id.txt
          docker run --rm --entrypoint /bin/bash "$DAPPER_IMAGE" -lc '
            set -euo pipefail
            dpkg-query -W -f="package\t\${binary:Package}\t\${Version}\n" linux-libc-dev
            dpkg-query -L linux-libc-dev | LC_ALL=C sort | while IFS= read -r path; do
              if [ -f "$path" ]; then
                printf "file\t%s\t%s\t%s\n" "$path" "$(sha256sum "$path" | cut -d " " -f1)" "$(file -b "$path")"
              fi
            done
          ' > evidence/linux-libc-dev-owned-files.tsv
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/dapper-downloaded-toolchain.tsv \
            > evidence/dapper-downloaded-toolchain.tsv
          docker run --rm --entrypoint cat "$RUNTIME_IMAGE" \
            /usr/share/pasturestack/manifests/runtime-ubuntu-packages.tsv \
            > evidence/runtime-dpkg.tsv

          for manifest in evidence/dapper-dpkg.tsv evidence/runtime-dpkg.tsv; do
            grep -F $'metadata\tubuntu_snapshot\t-\t20261020T000000Z' "$manifest" >/dev/null
            test "$(grep -c '^package' "$manifest")" -gt 0
          done
          grep -F $'gcc\t4:15.2.0-5ubuntu1\t15.2.0' evidence/dapper-gcc.tsv >/dev/null
          awk -F '\t' '
            NR == 1 { next }
            $4 !~ /^[0-9a-f]{64}$/ || $5 == "" { exit 1 }
            END { if (NR != 4) exit 1 }
          ' evidence/dapper-downloaded-toolchain.tsv
          grep -F $'docker\t29.7.2\tlinux-amd64\t' evidence/dapper-downloaded-toolchain.tsv >/dev/null
          grep -F $'buildx\t0.36.1\tlinux-amd64\t' evidence/dapper-downloaded-toolchain.tsv >/dev/null
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/buildx-go-version.txt \
            > evidence/buildx-go-version.txt
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/buildx-deps.txt > evidence/buildx-deps.txt
          awk '/^golang.org\/x\/crypto\/openpgp(\/|$)/ { print }' \
            evidence/buildx-deps.txt > evidence/buildx-openpgp-deps.txt
          printf 'buildx_openpgp_compiled_packages=%s\n' \
            "$(wc -l < evidence/buildx-openpgp-deps.txt)" | tee evidence/buildx-openpgp-summary.txt
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/manifests/docker-cli-go-version.txt \
            > evidence/docker-cli-go-version.txt
          docker run --rm --entrypoint cat "$DAPPER_IMAGE" \
            /usr/share/pasturestack/patches/buildx-security.patch \
            > evidence/buildx-security.patch
          diff -u toolchain/buildx-security.patch evidence/buildx-security.patch
          echo '9d424e752f24ea0e34ccd80340428f067ae8109204c401c93786a2b0be6ea993  evidence/buildx-security.patch' | sha256sum -c -
          if grep -F $'dep\tgithub.com/docker/docker\t' evidence/buildx-go-version.txt; then
            echo 'patched Buildx binary still records github.com/docker/docker' >&2
            exit 1
          fi
          grep -F 'go1.27.3' evidence/docker-cli-go-version.txt >/dev/null
          grep -F $'dep\tgolang.org/x/text\tv0.42.0\t' evidence/docker-cli-go-version.txt >/dev/null
          grep -F $'dep\tgoogle.golang.org/grpc\tv1.83.2\t' evidence/docker-cli-go-version.txt >/dev/null
          grep -F $'dep\tgithub.com/moby/go-archive\tv0.3.0\t' evidence/buildx-go-version.txt >/dev/null
          grep -F $'dep\tgolang.org/x/mod\tv0.41.0\t' evidence/buildx-go-version.txt >/dev/null
          grep -F $'dep\tgoogle.golang.org/grpc\tv1.83.2\t' evidence/buildx-go-version.txt >/dev/null
          for manifest in evidence/docker-cli-go-version.txt evidence/buildx-go-version.txt; do
            grep -F $'dep\tgolang.org/x/net\tv0.60.0\t' "$manifest" >/dev/null
            grep -F $'dep\tgo.opentelemetry.io/otel/sdk\tv1.45.0\t' "$manifest" >/dev/null
          done
          grep -F $'dep\tgithub.com/containerd/containerd/v2\tv2.3.6\t' evidence/buildx-go-version.txt >/dev/null
          grep -F $'package\tlinux-libc-dev:amd64\tamd64\t7.0.0-38.38' evidence/dapper-dpkg.tsv >/dev/null
          docker run --rm --entrypoint go --volume "$PWD:/work:ro" "$DAPPER_IMAGE" \
            version -m /work/bin/resource-scheduler \
            > evidence/resource-scheduler-go-version.txt

      - name: Run reachable Go vulnerability analysis
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "$PWD:/work:ro" \
            --entrypoint /bin/bash "$DAPPER_IMAGE" -lc '
              set -euo pipefail
              GOFLAGS=-mod=mod GOWORK=off GOBIN=/tmp/security-tools go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
              /tmp/security-tools/govulncheck -mode=binary -json /work/bin/resource-scheduler
            ' > evidence/govulncheck.json
          if jq -e 'select(.finding != null)' evidence/govulncheck.json >/dev/null; then
            echo 'A reachable Go vulnerability remains in resource-scheduler.' >&2
            exit 1
          fi

      - name: Generate source and image SBOMs and security reports
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          docker inspect "$TRIVY_IMAGE" > evidence/trivy-image-inspect.json
          docker run --rm "$TRIVY_IMAGE" --version > evidence/trivy-version.txt
          trivy_cache="$RUNNER_TEMP/resource-scheduler-trivy-cache"
          source_tree="$(mktemp -d)"
          trap 'rm -rf -- "$source_tree"' EXIT
          mkdir -p "$trivy_cache"
          git archive HEAD | tar -x -C "$source_tree"

          docker run --rm --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --download-db-only
          (
            cd "$trivy_cache"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) > evidence/trivy-database.sha256

          docker run --rm --network none \
            --volume "$source_tree:/scan:ro" \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --skip-db-update --offline-scan \
            --scanners vuln,secret --format json \
            --output /evidence/source-security.json /scan
          for scope in dapper runtime; do
            image_variable="${scope^^}_IMAGE"
            image="${!image_variable}"
            docker run --rm --network none \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$PWD/evidence:/evidence" \
              --volume "$trivy_cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --skip-db-update --offline-scan \
              --scanners vuln,secret --format json \
              --output "/evidence/${scope}-security.json" "$image"
          done

          docker run --rm --network none \
            --volume "$source_tree:/scan:ro" \
            --volume "$PWD/evidence:/evidence" \
            --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/source.cdx.json /scan
          for scope in dapper runtime; do
            image_variable="${scope^^}_IMAGE"
            image="${!image_variable}"
            docker run --rm --network none \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$PWD/evidence:/evidence" \
              --volume "$trivy_cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --skip-db-update --offline-scan --format cyclonedx \
              --output "/evidence/${scope}.cdx.json" "$image"
          done

      - name: Validate qualified backports and apply native runtime OpenVEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          consumer_container=$(docker create "$RUNTIME_IMAGE" /bin/true)
          if docker cp "$consumer_container:/usr/share/pasturestack/security/ubuntu-backports" evidence/ubuntu-backports; then
              docker rm "$consumer_container" >/dev/null
          else
              docker rm "$consumer_container" >/dev/null
              exit 1
          fi
          (cd evidence/ubuntu-backports && sha256sum --check SHA256SUMS)
          bundle_image='ghcr.io/pasturestack/ubuntu-security-backports:v0.1.1@sha256:45d6b507b63a18459ae5cf76afd4d9731f8ef43b9c40e4c3dbb01899e1752b19'
          mkdir -p evidence/bundle-tools
          bundle_container=$(docker create "$bundle_image" unused)
          if docker cp "$bundle_container:/out/verify-consumer-evidence.py" evidence/bundle-tools/verify-consumer-evidence.py && \
              docker cp "$bundle_container:/out/SHA256SUMS" evidence/bundle-tools/SHA256SUMS; then
              docker rm "$bundle_container" >/dev/null
          else
              docker rm "$bundle_container" >/dev/null
              exit 1
          fi
          (cd evidence/bundle-tools && \
              test "$(grep -Ec '^[0-9a-f]{64}  verify-consumer-evidence\.py$' SHA256SUMS)" -eq 1 && \
              grep -E '^[0-9a-f]{64}  verify-consumer-evidence\.py$' SHA256SUMS | sha256sum --check -)
          python3 evidence/bundle-tools/verify-consumer-evidence.py \
              --evidence-dir evidence/ubuntu-backports --sbom evidence/runtime.cdx.json \
              --bundle-checksums evidence/bundle-tools/SHA256SUMS \
              --expected-bundle-digest 'sha256:45d6b507b63a18459ae5cf76afd4d9731f8ef43b9c40e4c3dbb01899e1752b19' > evidence/ubuntu-backports-validation.json
          trivy_cache="$RUNNER_TEMP/resource-scheduler-trivy-cache"
          docker run --rm --network none --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/evidence:/evidence" --volume "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --skip-db-update --offline-scan --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --vex /evidence/ubuntu-backports/openvex.json \
            --format json --output /evidence/runtime-security.effective.json "$RUNTIME_IMAGE"

      - name: Enforce runtime and builder security boundaries
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/security-summary.txt
          jq '{critical: [.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length,
               high: [.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length}' \
            evidence/runtime-security.json > evidence/runtime-raw-severity-counts.json
          source_secrets="$(jq '[.Results[]?.Secrets[]?] | length' evidence/source-security.json)"
          runtime_secrets="$(jq '[.Results[]?.Secrets[]?] | length' evidence/runtime-security.effective.json)"
          runtime_critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' evidence/runtime-security.effective.json)"
          runtime_high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' evidence/runtime-security.effective.json)"
          runtime_vulnerabilities="$(jq '[.Results[]?.Vulnerabilities[]?] | length' evidence/runtime-security.effective.json)"
          bash scripts/assess-runtime-vulnerabilities \
            evidence/runtime-security.effective.json evidence "$RUNTIME_IMAGE"
          runtime_vendor_unfixed="$(sed -n 's/^runtime_vendor_unfixed_low_medium=//p' evidence/runtime-risk-summary.txt)"
          runtime_actionable="$(sed -n 's/^runtime_actionable=//p' evidence/runtime-risk-summary.txt)"
          dapper_secrets="$(jq '[.Results[]?.Secrets[]?] | length' evidence/dapper-security.json)"
          python3 scripts/assess-builder-vulnerabilities \
            evidence/dapper-security.json toolchain/linux-libc-dev-review.json \
            evidence/linux-libc-dev-owned-files.tsv evidence/runtime-dpkg.tsv evidence \
            | tee evidence/dapper-risk-summary.txt
          jq -r '.Results[]?.Vulnerabilities[]? |
            select(.Severity == "CRITICAL" or .Severity == "HIGH") |
            [.VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // ""), .Severity] | @tsv' \
            evidence/dapper-security.json | LC_ALL=C sort -u \
            > evidence/dapper-critical-high.tsv
          dapper_reviewed="$(jq '.statements | length' evidence/dapper.openvex.json)"
          printf 'source_secrets=%s\nruntime_secrets=%s\nruntime_vulnerabilities=%s\nruntime_vendor_unfixed=%s\nruntime_actionable=%s\nruntime_critical=%s\nruntime_high=%s\ndapper_secrets=%s\ndapper_reviewed_not_affected=%s\n' \
            "$source_secrets" "$runtime_secrets" "$runtime_vulnerabilities" "$runtime_vendor_unfixed" "$runtime_actionable" "$runtime_critical" "$runtime_high" \
            "$dapper_secrets" "$dapper_reviewed" | tee evidence/security-summary.txt
          test "$source_secrets" -eq 0
          test "$runtime_secrets" -eq 0
          test "$runtime_actionable" -eq 0
          test "$runtime_vulnerabilities" -eq "$runtime_vendor_unfixed"
          test "$runtime_critical" -eq 0
          test "$runtime_high" -eq 0
          test "$dapper_secrets" -eq 0
          ! grep -Eq $'^package\tlinux-libc-dev([:]|\t)' evidence/runtime-dpkg.tsv
          test "$(jq '.statements | length' evidence/dapper.openvex.json)" -eq \
            "$(wc -l < evidence/dapper-critical-high.tsv)"
          jq -e \
            '(has("x-pasturestack-expires") | not) and
             all(.statements[];
               .status == "not_affected" and
               .justification == "vulnerable_code_not_present" and
               (.products | length) == 1 and
               (.products[0].hashes["sha-256"] | test("^[0-9a-f]{64}$")))' \
            evidence/dapper.openvex.json >/dev/null
          for sbom in evidence/source.cdx.json evidence/dapper.cdx.json evidence/runtime.cdx.json; do
            jq -e '.bomFormat == "CycloneDX"' "$sbom" >/dev/null
          done

      - name: Retain the exact verified runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-runtime
          docker image inspect "$RUNTIME_IMAGE" > dist/security-runtime/images.json
          docker save "$RUNTIME_IMAGE" | gzip -n > dist/security-runtime/images.tar.gz
          cp evidence/runtime-security.json evidence/runtime-security.effective.json evidence/runtime.cdx.json dist/security-runtime/
          tar -cf dist/security-runtime/ubuntu-backports-evidence.tar -C evidence ubuntu-backports ubuntu-backports-validation.json
          printf '%s\n' "$GITHUB_SHA" > dist/security-runtime/source-revision.txt
          (cd dist/security-runtime && sha256sum -- *.json *.tar images.tar.gz source-revision.txt > SHA256SUMS)
      - name: Retain verified runtime for immutable publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-runtime-${{ github.sha }}
          path: dist/security-runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-scheduler-supply-chain-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean runner resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trivy_cache="$RUNNER_TEMP/resource-scheduler-trivy-cache"
          owner="$(id -u):$(id -g)"
          if docker image inspect "$TRIVY_IMAGE" >/dev/null 2>&1; then
            if [ -d evidence ]; then
              docker run --rm --volume "$PWD/evidence:/target" --entrypoint chown \
                "$TRIVY_IMAGE" -R "$owner" /target
            fi
            if [ -d "$trivy_cache" ]; then
              docker run --rm --volume "$trivy_cache:/target" --entrypoint chown \
                "$TRIVY_IMAGE" -R "$owner" /target
            fi
          fi
          images=("$DAPPER_IMAGE" "$TRIVY_IMAGE")
          if [ -n "${RUNTIME_IMAGE:-}" ]; then
            images+=("$RUNTIME_IMAGE")
          fi
          for image in "${images[@]}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm -f "$image" >/dev/null
            fi
          done
          docker builder prune --all --force >/dev/null
          rm -rf bin dist evidence "$trivy_cache"
