name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated pure numeric release tag to resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: resource-scheduler-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DAPPER_IMAGE: local/resource-scheduler-release-dapper:${{ github.sha }}
      TARGET_REPOSITORY: ghcr.io/pasturestack/resource-scheduler
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pure numeric release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          printf 'RELEASE_COMMIT=%s\n' "$release_commit" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"

      - name: Build, test, and package exact tag
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.release_tag || github.ref_name }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ghcr.io/pasturestack
        run: |
          set -euo pipefail
          make ci DAPPER_IMAGE="$DAPPER_IMAGE"
          runtime_image="$(cat dist/images)"
          test "$runtime_image" = "$TARGET_REPOSITORY:$RELEASE_TAG"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$runtime_image")" = "$RELEASE_TAG"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$runtime_image")" = "$RELEASE_COMMIT"
          printf 'RUNTIME_IMAGE=%s\n' "$runtime_image" >> "$GITHUB_ENV"

      - name: Scan release image and create release evidence
        shell: bash
        run: |
          set -euo pipefail
          release_dir=dist/release
          release_root="$release_dir/resource-scheduler-${RELEASE_TAG#v}-linux-amd64"
          mkdir -p "$release_root"
          cp bin/resource-scheduler LICENSE COMPATIBILITY.md ORIGIN.md SECURITY.md THIRD_PARTY_NOTICES.md "$release_root/"
          cp -R LICENSES "$release_root/third-party-licenses"

          docker pull "$TRIVY_IMAGE"
          cache="$RUNNER_TEMP/resource-scheduler-release-trivy-cache"
          mkdir -p "$cache"
          docker run --rm -v "$cache:/root/.cache/trivy" "$TRIVY_IMAGE" image --download-db-only
          docker run --rm --network none \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/$release_dir:/release" \
            -v "$cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --skip-db-update --offline-scan \
            --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output "/release/resource-scheduler-${RELEASE_TAG#v}-security.json" "$RUNTIME_IMAGE"
          docker run --rm --network none \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/$release_dir:/release" \
            -v "$cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --skip-db-update --offline-scan --format cyclonedx \
            --output "/release/resource-scheduler-${RELEASE_TAG#v}-image.cdx.json" "$RUNTIME_IMAGE"
          mkdir -p "$release_dir"
          consumer_container=$(docker create "$RUNTIME_IMAGE" /bin/true)
          if docker cp "$consumer_container:/usr/share/pasturestack/security/ubuntu-backports" "$release_dir"/ubuntu-backports; then
              docker rm "$consumer_container" >/dev/null
          else
              docker rm "$consumer_container" >/dev/null
              exit 1
          fi
          (cd "$release_dir"/ubuntu-backports && sha256sum --check SHA256SUMS)
          bundle_image='ghcr.io/pasturestack/ubuntu-security-backports:v0.1.1@sha256:45d6b507b63a18459ae5cf76afd4d9731f8ef43b9c40e4c3dbb01899e1752b19'
          mkdir -p "$release_dir"/bundle-tools
          bundle_container=$(docker create "$bundle_image" unused)
          if docker cp "$bundle_container:/out/verify-consumer-evidence.py" "$release_dir"/bundle-tools/verify-consumer-evidence.py && \
              docker cp "$bundle_container:/out/SHA256SUMS" "$release_dir"/bundle-tools/SHA256SUMS; then
              docker rm "$bundle_container" >/dev/null
          else
              docker rm "$bundle_container" >/dev/null
              exit 1
          fi
          (cd "$release_dir"/bundle-tools && \
              test "$(grep -Ec '^[0-9a-f]{64}  verify-consumer-evidence\.py$' SHA256SUMS)" -eq 1 && \
              grep -E '^[0-9a-f]{64}  verify-consumer-evidence\.py$' SHA256SUMS | sha256sum --check -)
          python3 "$release_dir"/bundle-tools/verify-consumer-evidence.py \
              --evidence-dir "$release_dir"/ubuntu-backports --sbom "$release_dir/resource-scheduler-${RELEASE_TAG#v}-image.cdx.json" \
              --bundle-checksums "$release_dir"/bundle-tools/SHA256SUMS \
              --expected-bundle-digest 'sha256:45d6b507b63a18459ae5cf76afd4d9731f8ef43b9c40e4c3dbb01899e1752b19' > "$release_dir"/ubuntu-backports-validation.json
          docker run --rm --network none -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/$release_dir:/release" -v "$cache:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --skip-db-update --offline-scan --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --vex /release/ubuntu-backports/openvex.json \
            --format json --output "/release/resource-scheduler-${RELEASE_TAG#v}-security.effective.json" "$RUNTIME_IMAGE"
          bash scripts/assess-runtime-vulnerabilities \
            "$release_dir/resource-scheduler-${RELEASE_TAG#v}-security.effective.json" \
            "$release_dir" "$RUNTIME_IMAGE"
          tar -cf "$release_dir/ubuntu-backports-evidence.tar" -C "$release_dir" ubuntu-backports ubuntu-backports-validation.json
          docker run --rm --entrypoint cat "$RUNTIME_IMAGE" \
            /usr/share/pasturestack/manifests/runtime-ubuntu-packages.tsv \
            > "$release_dir/resource-scheduler-${RELEASE_TAG#v}-ubuntu-packages.tsv"
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | length > 0) and ([.components[]?] | length > 0)' \
            "$release_dir/resource-scheduler-${RELEASE_TAG#v}-image.cdx.json" >/dev/null

          source_epoch="$(git show -s --format=%ct HEAD)"
          find "$release_root" -exec touch -h -d "@${source_epoch}" {} +
          tar --sort=name --mtime="@${source_epoch}" --owner=0 --group=0 --numeric-owner \
            -C "$release_dir" -cJf "$release_dir/resource-scheduler-${RELEASE_TAG#v}-linux-amd64.tar.xz" \
            "resource-scheduler-${RELEASE_TAG#v}-linux-amd64"
          (
            cd "$release_dir"
            sha256sum \
              "resource-scheduler-${RELEASE_TAG#v}-linux-amd64.tar.xz" \
              "resource-scheduler-${RELEASE_TAG#v}-image.cdx.json" \
              "resource-scheduler-${RELEASE_TAG#v}-security.json" \
              "resource-scheduler-${RELEASE_TAG#v}-security.effective.json" ubuntu-backports-evidence.tar \
              "resource-scheduler-${RELEASE_TAG#v}-ubuntu-packages.tsv" \
              runtime-risk-summary.txt \
              runtime-vendor-unfixed.tsv \
              runtime-vendor-unfixed.openvex.json \
              > SHA256SUMS
          )

      - name: Publish immutable runtime image
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$RUNTIME_IMAGE"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$RUNTIME_IMAGE")"
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest release evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS

      - name: Attest runtime image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.TARGET_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Resource Scheduler ${RELEASE_TAG#v}" \
            --notes 'Maintained resource scheduler runtime published from a pure numeric version, with tests, SBOM, package inventory, full vulnerability evidence, an explicit register of vendor-unfixed Low/Medium findings, checksums, and build provenance.' \
            "dist/release/resource-scheduler-${RELEASE_TAG#v}-linux-amd64.tar.xz" \
            "dist/release/resource-scheduler-${RELEASE_TAG#v}-image.cdx.json" \
            "dist/release/resource-scheduler-${RELEASE_TAG#v}-security.json" \
            "dist/release/resource-scheduler-${RELEASE_TAG#v}-security.effective.json" \
            dist/release/ubuntu-backports-evidence.tar \
            "dist/release/resource-scheduler-${RELEASE_TAG#v}-ubuntu-packages.tsv" \
            dist/release/runtime-risk-summary.txt \
            dist/release/runtime-vendor-unfixed.tsv \
            dist/release/runtime-vendor-unfixed.openvex.json \
            dist/release/SHA256SUMS

      - name: Clean run-owned resources
        if: always()
        shell: bash
        run: |
          set +e
          docker logout ghcr.io >/dev/null 2>&1
          owner="$(id -u):$(id -g)"
          cache="$RUNNER_TEMP/resource-scheduler-release-trivy-cache"
          if [ -d "$cache" ] && docker image inspect "$TRIVY_IMAGE" >/dev/null 2>&1; then
            docker run --rm --volume "$cache:/target" --entrypoint chown \
              "$TRIVY_IMAGE" -R "$owner" /target >/dev/null 2>&1
          fi
          for image in "${RUNTIME_IMAGE:-}" "$DAPPER_IMAGE" "$TRIVY_IMAGE"; do
            if [ -n "$image" ] && docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm -f "$image" >/dev/null 2>&1
            fi
          done
          rm -rf -- bin dist "$cache"
